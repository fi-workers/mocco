# Publish the SDK packages (changesets). On main, the action opens or updates the
# "Version packages" PR; merging that PR publishes to npm with trusted publishing
# (OIDC — no npm token) and provenance. The @mocco scope must be linked to this
# repository as a trusted publisher on npmjs.com first.
#
# The upload goes through the npm CLI (`scripts/publish-packages.mjs`), not
# `changeset publish`. Changesets publishes through the detected package manager, and
# yarn cannot do OIDC — it only looks for a stored `npmAuthToken` and fails with
# `YN0033: No authentication configured`. Only npm's own CLI exchanges the Actions OIDC
# token for a registry credential, and only from 11.5.1, which is newer than the npm
# bundled with Node 22 — hence the explicit upgrade below.
name: Publish SDKs

on:
  push:
    branches: [main]

concurrency: publish-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # setup-node's yarn cache runs the global yarn 1, which refuses the packageManager
      # pin; corepack has to be on first, so no setup-node cache (as in ci.yml).
      - name: Enable corepack (yarn is integrity-pinned via packageManager)
        run: corepack enable
      # Node 22 bundles npm 10, which has no trusted publishing. Pinned so a broken
      # npm release can't silently change how this job authenticates.
      - name: Install an npm that can do trusted publishing
        run: npm install --global npm@11.6.2
      - run: yarn install --immutable
      - run: yarn sdk:build
      - run: yarn test-sdk
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: yarn version-packages
          publish-script: yarn release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
