# Migrate — applies the committed drizzle migrations to the production database once
# they are on main. Secrets live only in the `migrations` environment, which only the
# main branch may use, and this workflow never runs on pull requests
# (docs/reference/ci-conventions.md).
#
# It calls drizzle-kit directly, not `yarn db:migrate`: that script goes through
# with-env, where the committed env/.env.local (the local DATABASE_URL) wins over the
# process environment. drizzle.config.ts reads process.env.DATABASE_URL.
#
# Vercel deploys main at the same time. Migrations are additive, and this job
# (about a minute) finishes well before a production build (several minutes), so new
# code meets the new schema. A migration that removes something the running code still
# uses must ship in a later PR than the code change that stops using it.
name: Migrate

on:
  push:
    branches: [main]
    paths:
      - packages/backend/src/infra/db/migrations/**
      - drizzle.config.ts
      - .github/workflows/migrate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One migration at a time, and never cancel one that has started.
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: migrate production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: migrations
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Enable corepack (yarn is integrity-pinned via packageManager)
        run: corepack enable
      - name: Install (immutable, dependency lifecycle scripts disabled)
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: 'false'
      - name: Check the database secret is set
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Set the DATABASE_URL secret in the 'migrations' environment (Settings → Environments)."
            exit 1
          fi
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: yarn drizzle-kit migrate
