# Publish an Expo update to Mocco-hosted OTA with trusted publishing: the job's GitHub
# OIDC token is exchanged for a 15-minute upload session, so no Mocco key is stored in
# CI. The repository and ref must be trusted on the app (OTA hosting → Trusted
# publishing), and the job needs `permissions: id-token: write`.
name: Mocco OTA publish
description: Export, sign and publish an Expo update to Mocco-hosted OTA with GitHub OIDC.
inputs:
  app-id:
    description: The Mocco OTA app id. Defaults to the one in app.json's updates.url.
    required: false
  channel:
    description: An unprotected channel to promote to once Mocco has verified the release.
    required: false
  platform:
    description: ios, android or all.
    required: false
    default: all
  working-directory:
    description: The Expo project directory.
    required: false
    default: .
  message:
    description: The release message. Defaults to the commit subject.
    required: false
  cli-version:
    description: >-
      The @mocco/cli version to run, or `source` to build it from this repository at the
      ref this action was taken from — for a Mocco whose packages aren't on a registry the
      job can reach (a private deployment, or before the first publish).
    required: false
    default: latest
runs:
  using: composite
  steps:
    # `source` builds the CLI from the same commit as this action, so the two can't drift.
    - name: Check out Mocco
      if: inputs.cli-version == 'source'
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        repository: ${{ github.action_repository || 'fi-workers/mocco' }}
        ref: ${{ github.action_ref || 'main' }}
        path: .mocco-cli

    - name: Build the CLI
      if: inputs.cli-version == 'source'
      shell: bash
      working-directory: .mocco-cli
      run: |
        corepack enable
        yarn install --immutable
        yarn cli build

    - name: Publish
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_APP_ID: ${{ inputs.app-id }}
        INPUT_CHANNEL: ${{ inputs.channel }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_MESSAGE: ${{ inputs.message }}
        CLI_VERSION: ${{ inputs.cli-version }}
        CLI_CHECKOUT: ${{ github.workspace }}/.mocco-cli
      run: |
        args=(publish --oidc --platform "$INPUT_PLATFORM")
        if [ -n "$INPUT_APP_ID" ]; then args+=(--app-id "$INPUT_APP_ID"); fi
        if [ -n "$INPUT_CHANNEL" ]; then args+=(--channel "$INPUT_CHANNEL"); fi
        if [ -n "$INPUT_MESSAGE" ]; then args+=(--message "$INPUT_MESSAGE"); fi
        if [ "$CLI_VERSION" = "source" ]; then
          node "$CLI_CHECKOUT/packages/cli/dist/cli.js" ota "${args[@]}"
        else
          npx --yes "@mocco/cli@${CLI_VERSION}" ota "${args[@]}"
        fi
